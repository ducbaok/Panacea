# B-19 — mutation trả `Pin!` (trước 17/08/2026 là `Boolean!`).
# Ba field dưới đây là TOÀN BỘ lý do bỏ được `refetchPin`: Apollo chuẩn hoá
# theo `id`, nên `reactionCount`/`viewerReaction` mới ghi đè thẳng vào cache
# entry mà lưới, modal và trang chi tiết đang cùng đọc.
mutation TogglePinReaction($pinId: ID!, $type: ReactionType!) {
  togglePinReaction(pinId: $pinId, type: $type) {
    id
    reactionCount
    viewerReaction
  }
}

mutation SavePin($input: SavePinInput!) {
  savePin(input: $input) {
    id
    pinId
    boardId
    sectionId
    note
    sortOrder
    createdAt
    pin {
      id
      isSavedByViewer
    }
  }
}

mutation UnsavePin($pinId: ID!, $boardId: ID) {
  unsavePin(pinId: $pinId, boardId: $boardId)
}

mutation CreateComment($input: CreateCommentInput!) {
  createComment(input: $input) {
    id
    content
    parentId
    createdAt
    updatedAt
    replyCount
    reactionCount
    isReactedByViewer
    user {
      id
      name
      username
      avatarUrl
    }
  }
}

mutation UpdateComment($input: UpdateCommentInput!) {
  updateComment(input: $input) {
    id
    content
    updatedAt
  }
}

mutation DeleteComment($id: String!) {
  deleteComment(id: $id) {
    id
    parentId
  }
}

# B-19 — trả `Comment!` (trước 17/08/2026 là `Boolean!`). Selection set là bắt
# buộc kể từ đó; nó cũng chính là thứ làm §b3 (cảm xúc bình luận) không cần
# optimistic Map + delta số đếm — Apollo chuẩn hoá theo `id` là đủ.
mutation ToggleCommentReaction($input: ToggleCommentReactionInput!) {
  toggleCommentReaction(input: $input) {
    id
    reactionCount
    isReactedByViewer
  }
}

mutation Follow($userId: String!) {
  follow(userId: $userId)
}

mutation Unfollow($userId: String!) {
  unfollow(userId: $userId)
}

mutation BlockUser($userId: String!) {
  blockUser(userId: $userId)
}

mutation UnblockUser($userId: String!) {
  unblockUser(userId: $userId)
}
