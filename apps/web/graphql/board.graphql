mutation CreateBoard($input: CreateBoardInput!) {
  createBoard(input: $input) {
    id
    name
    description
    isSecret
    pinCount
    createdAt
    coverPin {
      id
      imageUrl
      thumbnailUrl
      imageWidth
      imageHeight
    }
  }
}

mutation UpdateBoard($input: UpdateBoardInput!) {
  updateBoard(input: $input) {
    id
    name
    description
    isSecret
    pinCount
    coverPin {
      id
      imageUrl
      thumbnailUrl
      imageWidth
      imageHeight
    }
  }
}

mutation DeleteBoard($id: ID!) {
  deleteBoard(id: $id)
}

query Board($id: ID!) {
  board(id: $id) {
    id
    name
    description
    isSecret
    coverPinId
    createdAt
    updatedAt
    pinCount
    user {
      id
      name
      username
      avatarUrl
    }
    coverPin {
      id
      imageUrl
      thumbnailUrl
      imageWidth
      imageHeight
    }
    sections {
      id
      name
      sortOrder
    }
    collaborators {
      id
      role
      user {
        id
        name
        username
        avatarUrl
      }
    }
  }
}

query UserBoards($userId: ID!, $first: Int! = 20, $after: String) {
  userBoards(userId: $userId, first: $first, after: $after) {
    items {
      id
      name
      isSecret
      pinCount
      createdAt
      coverPin {
        id
        imageUrl
        thumbnailUrl
        imageWidth
        imageHeight
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# ─────────── FE-10 · C6 quản lý section ───────────
# Đọc-side dùng lại query Board ở trên (đã select sections{id,name,sortOrder}).
# BoardSection KHÔNG có pinCount ở SDL ⇒ C6 bỏ nhãn "{n} pin" của bản vẽ (§4.3,
# người dùng đã chốt 17/08). Đừng thêm field đó vào đây khi backend chưa có.

mutation CreateSection($input: CreateSectionInput!) {
  createSection(input: $input) {
    id
    name
    sortOrder
  }
}

mutation UpdateSection($input: UpdateSectionInput!) {
  updateSection(input: $input) {
    id
    name
    sortOrder
  }
}

mutation DeleteSection($id: ID!) {
  deleteSection(id: $id)
}

# Nhận TOÀN BỘ mảng id theo thứ tự mới (backend set sortOrder = index trong một
# transaction) — KHÔNG gửi từng cặp (id, index). §4.7.
mutation ReorderSections($boardId: ID!, $sectionIds: [ID!]!) {
  reorderSections(boardId: $boardId, sectionIds: $sectionIds)
}

# ─────────── FE-10 · C7 cộng tác viên ───────────
# Không có query `boardCollaborators` riêng: danh sách nạp qua Board.collaborators
# ở trên và KHÔNG phân trang (§4.5). Chủ board KHÔNG nằm trong mảng đó.

mutation InviteCollaborator($boardId: ID!, $userId: ID!, $role: CollaboratorRole!) {
  inviteCollaborator(boardId: $boardId, userId: $userId, role: $role) {
    id
    role
    user {
      id
      name
      username
      avatarUrl
    }
  }
}

# Dùng cho CẢ hai nút: "Gỡ" (chủ gỡ người khác) và "Rời board" (CTV tự gỡ mình).
# Không có mutation `leaveBoard` — §4.7.
mutation RemoveCollaborator($boardId: ID!, $userId: ID!) {
  removeCollaborator(boardId: $boardId, userId: $userId)
}

mutation UpdateCollaboratorRole($boardId: ID!, $userId: ID!, $role: CollaboratorRole!) {
  updateCollaboratorRole(boardId: $boardId, userId: $userId, role: $role)
}

# ─────────── FE-10 · setBoardCover (C4) ───────────
mutation SetBoardCover($boardId: ID!, $pinId: ID!) {
  setBoardCover(boardId: $boardId, pinId: $pinId)
}

query BoardPins($boardId: ID!, $sectionId: ID, $first: Int! = 20, $after: String) {
  boardPins(boardId: $boardId, sectionId: $sectionId, first: $first, after: $after) {
    items {
      id
      note
      sortOrder
      createdAt
      pin {
        id
        title
        imageUrl
        thumbnailUrl
        mediumUrl
        imageWidth
        imageHeight
        savedCount
        commentCount
        creator {
          id
          username
          name
          avatarUrl
        }
        isSavedByViewer
        viewerReaction
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
