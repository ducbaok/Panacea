query UserByUsername($username: String!) {
  userByUsername(username: $username) {
    id
    name
    username
    avatarUrl
    coverUrl
    bio
    website
    followerCount
    followingCount
    isFollowedByViewer
    isFollowingViewer
    isBlockedByViewer
  }
}

# B-12 (§6b.2) — gợi ý người theo dõi cho khối banner B1.
query SuggestedUsers($first: Int = 10) {
  suggestedUsers(first: $first) {
    id
    name
    username
    avatarUrl
    followerCount
  }
}

# §6b.3 — danh sách người TÔI đã chặn (C2b). Cursor-paginated.
query BlockedUsers($first: Int! = 20, $after: String) {
  blockedUsers(first: $first, after: $after) {
    items {
      id
      name
      username
      avatarUrl
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query Followers($userId: String!, $first: Int! = 20, $after: String) {
  followers(userId: $userId, first: $first, after: $after) {
    items {
      id
      name
      username
      avatarUrl
      isFollowedByViewer
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query Following($userId: String!, $first: Int! = 20, $after: String) {
  following(userId: $userId, first: $first, after: $after) {
    items {
      id
      name
      username
      avatarUrl
      isFollowedByViewer
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
