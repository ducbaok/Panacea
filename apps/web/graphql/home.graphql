query HomeFeed($first: Int! = 20, $after: String) {
  homeFeed(first: $first, after: $after) {
    source
    items {
      id
      title
      imageUrl
      thumbnailUrl
      mediumUrl
      imageWidth
      imageHeight
      savedCount
      reactionCount
      commentCount
      createdAt
      creator {
        id
        name
        username
        avatarUrl
      }
      isSavedByViewer
      viewerReaction
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
