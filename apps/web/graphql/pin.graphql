mutation CreatePin($input: CreatePinInput!) {
  createPin(input: $input) {
    id
    title
    description
    imageUrl
    thumbnailUrl
    mediumUrl
    imageWidth
    imageHeight
    sourceUrl
    savedCount
    commentCount
    createdAt
    creator {
      id
      username
      name
      avatarUrl
    }
    tags {
      id
      name
    }
    categories {
      id
      name
      slug
      icon
    }
    isSavedByViewer
    viewerReaction
  }
}

mutation UpdatePin($input: UpdatePinInput!) {
  updatePin(input: $input) {
    id
    title
    description
    sourceUrl
    imageUrl
    imageWidth
    imageHeight
    tags {
      id
      name
    }
    categories {
      id
      name
      slug
      icon
    }
    isSavedByViewer
    viewerReaction
  }
}

mutation DeletePin($id: ID!) {
  deletePin(id: $id) {
    id
  }
}

query Pin($id: ID!) {
  pin(id: $id) {
    id
    title
    description
    imageUrl
    thumbnailUrl
    mediumUrl
    largeUrl
    imageWidth
    imageHeight
    sourceUrl
    viewCount
    clickCount
    savedCount
    reactionCount
    commentCount
    createdAt
    creator {
      id
      name
      username
      avatarUrl
      isFollowedByViewer
      followerCount
    }
    tags {
      id
      name
    }
    categories {
      id
      name
      slug
      icon
    }
    isSavedByViewer
    viewerReaction
  }
}

# ─────────── FE-10 · wire B-4 (đo lượt xem / lượt bấm) ───────────
# Boolean trả về = "lần gọi NÀY có làm bộ đếm tăng không", KHÔNG phải "đã nhận
# yêu cầu". false là BÌNH THƯỜNG: trong cửa sổ debounce 30 phút, hoặc không định
# danh được (không token + không x-anon-id), hoặc click trên pin không có
# sourceUrl. ⇒ Gọi fire-and-forget, KHÔNG render theo kết quả, KHÔNG toast.
# Guard backend là GqlOptionalAuthGuard: khách vãng lai được đếm qua header
# `x-anon-id` (xem lib/anon-id.ts).

mutation TrackPinView($pinId: ID!) {
  trackPinView(pinId: $pinId)
}

mutation TrackPinClick($pinId: ID!) {
  trackPinClick(pinId: $pinId)
}

query UserPins($userId: ID!, $first: Int! = 20, $after: String) {
  userPins(userId: $userId, first: $first, after: $after) {
    items {
      id
      title
      imageUrl
      thumbnailUrl
      mediumUrl
      imageWidth
      imageHeight
      savedCount
      commentCount
      creator {
        id
        username
        name
        avatarUrl
      }
      isSavedByViewer
      viewerReaction
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
