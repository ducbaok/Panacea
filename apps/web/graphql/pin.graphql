mutation CreatePin($input: CreatePinInput!) {
  createPin(input: $input) {
    id
    title
    description
    imageUrl
    thumbnailUrl
    videoUrl
    videoDurationMs
    mediumUrl
    largeUrl
    imageWidth
    imageHeight
    sourceUrl
    savedCount
    commentCount
    createdAt
    creator {
      id
      username
      name
      avatarUrl
    }
    tags {
      id
      name
    }
    categories {
      id
      name
      slug
      icon
    }
    visibility
    audienceCircleId
    expiresAt
    isSavedByViewer
    viewerReaction
  }
}

mutation UpdatePin($input: UpdatePinInput!) {
  updatePin(input: $input) {
    id
    title
    description
    sourceUrl
    imageUrl
    imageWidth
    imageHeight
    tags {
      id
      name
    }
    categories {
      id
      name
      slug
      icon
    }
    visibility
    audienceCircleId
    expiresAt
    isSavedByViewer
    viewerReaction
  }
}

mutation DeletePin($id: ID!) {
  deletePin(id: $id) {
    id
  }
}

query Pin($id: ID!) {
  pin(id: $id) {
    id
    title
    description
    imageUrl
    thumbnailUrl
    videoUrl
    videoDurationMs
    mediumUrl
    largeUrl
    imageWidth
    imageHeight
    sourceUrl
    viewCount
    clickCount
    savedCount
    reactionCount
    commentCount
    createdAt
    creator {
      id
      name
      username
      avatarUrl
      isFollowedByViewer
      followerCount
    }
    tags {
      id
      name
    }
    categories {
      id
      name
      slug
      icon
    }
    visibility
    audienceCircleId
    expiresAt
    isSavedByViewer
    viewerReaction
  }
}

# ─────────── FE-10 · wire B-4 (đo lượt xem / lượt bấm) ───────────
# Boolean trả về = "lần gọi NÀY có làm bộ đếm tăng không", KHÔNG phải "đã nhận
# yêu cầu". false là BÌNH THƯỜNG: trong cửa sổ debounce 30 phút, hoặc không định
# danh được (không token + không x-anon-id), hoặc click trên pin không có
# sourceUrl. ⇒ Gọi fire-and-forget, KHÔNG render theo kết quả, KHÔNG toast.
# Guard backend là GqlOptionalAuthGuard: khách vãng lai được đếm qua header
# `x-anon-id` (xem lib/anon-id.ts).

mutation TrackPinView($pinId: ID!) {
  trackPinView(pinId: $pinId)
}

mutation TrackPinClick($pinId: ID!) {
  trackPinClick(pinId: $pinId)
}

query UserPins($userId: ID!, $first: Int! = 20, $after: String) {
  userPins(userId: $userId, first: $first, after: $after) {
    items {
      id
      title
      imageUrl
      thumbnailUrl
      videoUrl
      videoDurationMs
      mediumUrl
      imageWidth
      imageHeight
      savedCount
      commentCount
      creator {
        id
        username
        name
        avatarUrl
      }
      visibility
      audienceCircleId
      expiresAt
      isSavedByViewer
      viewerReaction
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# ─────────── F2 · XH-10 — AI ĐÃ XEM (XH-VIEWERS) ───────────
# CHỈ chủ pin gọi được; pin của người khác trả 404 (KHÔNG phải 403 — 403 tự nó
# đã xác nhận pin có thật). Ba trạng thái "không phải pin của bạn" / "pin không
# tồn tại" / "pin đã xoá mềm" cố ý trả về cùng một thứ.
#
# Ba luật của danh sách này nằm ở BACKEND, FE không lặp lại bộ lọc nào:
#   1. chỉ ghi PinView cho pin KHÔNG công khai ⇒ pin PUBLIC luôn trả mảng rỗng;
#   2. khách vãng lai vào `viewCount` nhưng không có danh tính ⇒ không vào đây;
#   3. XH-QĐ-15 — ai bị bớt khỏi vòng thì BIẾN MẤT khỏi danh sách (luồng C lọc
#      theo `CircleMember` HIỆN TẠI, không phải theo lúc xem).
#
# ⚠️ Trả `[User!]!` — KHÔNG có `firstViewedAt`. Backend dùng mốc đó để XẾP THỨ
# TỰ (mới nhất trước) rồi bỏ đi (`pins.resolver.ts` docblock `pinViewers`). Thứ
# tự mảng LÀ thông tin: render đúng thứ tự nhận được, đừng sort lại ở client.
query PinViewers($pinId: ID!) {
  pinViewers(pinId: $pinId) {
    id
    name
    username
    avatarUrl
  }
}
