subscription NotificationReceived {
  notificationReceived {
    id
    type
    isRead
    # ⚠️ KHÔNG chọn `createdAt` (DateTime) ở đây. Payload subscription đi qua
    # PubSub biến Date → chuỗi ISO, và scalar DateTime của backend serialize
    # chuỗi thành null ⇒ CẢ subscription lỗi (và có thể làm sập API). Bug backend
    # `notificationReceived` — xem debug_history §FE-8. Frontend gán createdAt
    # xấp xỉ phía client khi chèn (tin vừa tới ⇒ "Vừa xong" là đúng).
    actor {
      id
      name
      username
      avatarUrl
    }
    pin {
      id
      imageUrl
      thumbnailUrl
      title
    }
    comment {
      id
      content
    }
  }
}

subscription MessageReceived($conversationId: String!) {
  messageReceived(conversationId: $conversationId) {
    id
    content
    attachedPinId
    conversationId
    senderId
    readAt
    createdAt
    sender {
      id
      name
      username
      avatarUrl
    }
    attachedPin {
      id
      imageUrl
      thumbnailUrl
      title
    }
  }
}
